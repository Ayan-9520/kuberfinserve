<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none" role="img" aria-label="Loan application documents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0fdf9"/>
      <stop offset="0.55" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="320" fill="url(#bg)"/>
  <!-- decorative circles -->
  <circle cx="680" cy="60" r="48" fill="#00c389" fill-opacity="0.12"/>
  <circle cx="120" cy="260" r="64" fill="#0b5d4b" fill-opacity="0.08"/>

  <!-- main document stack -->
  <g filter="url(#shadow)" transform="translate(280 52)">
    <rect x="24" y="18" width="200" height="248" rx="10" fill="#e2e8f0" transform="rotate(-4 124 142)"/>
    <rect x="12" y="10" width="200" height="248" rx="10" fill="#f1f5f9" transform="rotate(2 112 134)"/>
    <rect x="0" y="0" width="200" height="248" rx="10" fill="url(#paper)"/>
    <rect x="16" y="28" width="72" height="8" rx="4" fill="#0b5d4b" fill-opacity="0.85"/>
    <rect x="16" y="48" width="168" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="16" y="64" width="148" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="16" y="80" width="160" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="16" y="96" width="120" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="16" y="120" width="168" height="88" rx="8" fill="#f0fdf9" stroke="#00c389" stroke-width="2"/>
    <rect x="28" y="136" width="56" height="6" rx="3" fill="#0b5d4b" fill-opacity="0.5"/>
    <rect x="28" y="152" width="140" height="5" rx="2.5" fill="#bbf7d0"/>
    <rect x="28" y="166" width="120" height="5" rx="2.5" fill="#dcfce7"/>
    <rect x="28" y="180" width="130" height="5" rx="2.5" fill="#dcfce7"/>
    <circle cx="168" cy="200" r="18" fill="#0b5d4b" fill-opacity="0.15"/>
    <path d="M160 200l6 6 12-14" stroke="#0b5d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- PAN / ID card -->
  <g filter="url(#shadow)" transform="translate(88 88)">
    <rect width="168" height="104" rx="12" fill="url(#paper)" stroke="#0b5d4b" stroke-width="2"/>
    <rect x="14" y="14" width="48" height="48" rx="8" fill="#e2e8f0"/>
    <rect x="72" y="18" width="78" height="8" rx="4" fill="#0b5d4b" fill-opacity="0.7"/>
    <rect x="72" y="34" width="64" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="14" y="72" width="140" height="6" rx="3" fill="#00c389" fill-opacity="0.35"/>
    <rect x="14" y="86" width="100" height="6" rx="3" fill="#e2e8f0"/>
    <text x="14" y="62" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#0b5d4b">PAN</text>
  </g>

  <!-- bank statement -->
  <g filter="url(#shadow)" transform="translate(520 108)">
    <rect width="176" height="120" rx="12" fill="url(#paper)" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="14" y="14" width="148" height="28" rx="6" fill="#0b5d4b" fill-opacity="0.12"/>
    <path d="M22 28h40M22 36h28" stroke="#0b5d4b" stroke-width="2" stroke-linecap="round"/>
    <rect x="14" y="52" width="120" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="14" y="64" width="100" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="14" y="76" width="110" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="14" y="88" width="80" height="5" rx="2.5" fill="#00c389" fill-opacity="0.4"/>
    <rect x="14" y="100" width="90" height="5" rx="2.5" fill="#e2e8f0"/>
  </g>

  <!-- salary slip -->
  <g filter="url(#shadow)" transform="translate(148 200)">
    <rect width="140" height="88" rx="10" fill="url(#paper)" transform="rotate(-6 70 44)"/>
    <rect x="12" y="14" width="80" height="7" rx="3.5" fill="#0b5d4b" fill-opacity="0.6"/>
    <rect x="12" y="30" width="116" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="12" y="42" width="100" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="12" y="54" width="108" height="5" rx="2.5" fill="#bbf7d0"/>
    <rect x="12" y="66" width="72" height="5" rx="2.5" fill="#e2e8f0"/>
  </g>

  <!-- clip -->
  <g transform="translate(248 40)">
    <path d="M0 0h28v52a14 14 0 1 1-28 0V0z" fill="#64748b"/>
    <path d="M4 4h20v44a10 10 0 1 1-20 0V4z" fill="#94a3b8"/>
  </g>
</svg>
